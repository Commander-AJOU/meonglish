# 이 파일을 secrets.properties로 복사한 뒤 값을 채우세요. secrets.properties는 git에 올라가지 않습니다.

# ElevenLabs API 키 (https://elevenlabs.io/app/settings/api-keys). 비워 두면 차량 기본 음성으로 읽습니다.
ELEVENLABS_API_KEY=

# 읽어 줄 목소리의 Voice ID. 비워 두면 내 계정의 목소리 중 귀여운 쪽을 앱이 골라 씁니다.
ELEVENLABS_VOICE_ID=

# 음성 모델. 비워 두면 eleven_v3 (표현이 풍부한 모델).
ELEVENLABS_MODEL=

# OpenAI API 키 (https://platform.openai.com/api-keys). 비워 두면 매일 새 이야기 대신 기본 이야기만 들려줍니다.
OPENAI_API_KEY=

# 이야기를 쓰는 모델. 비워 두면 gpt-5-mini. gpt-5-nano는 더 싸지만 한국어 동화 품질이 떨어집니다.
OPENAI_MODEL=

# Anthropic API 키 (https://console.anthropic.com/settings/keys). 레벨 테스트에서 Claude가 아이의 대답을 보고
# 다음 문제를 고르고 레벨을 정합니다. 비워 두면 앱에 든 기본 테스트(한 레벨에 두 문제씩)로 진행합니다.
ANTHROPIC_API_KEY=

# 레벨 테스트에 쓰는 모델. 비워 두면 claude-opus-5-5.
ANTHROPIC_MODEL=
