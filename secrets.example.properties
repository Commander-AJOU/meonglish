# 이 파일을 secrets.properties로 복사한 뒤 값을 채우세요. secrets.properties는 git에 올라가지 않습니다.

# ElevenLabs API 키 (https://elevenlabs.io/app/settings/api-keys). 비워 두면 차량 기본 음성으로 읽습니다.
ELEVENLABS_API_KEY=

# 읽어 줄 목소리의 Voice ID. 비워 두면 내 계정의 목소리 중 귀여운 쪽을 앱이 골라 씁니다.
ELEVENLABS_VOICE_ID=

# 음성 모델. 비워 두면 eleven_v3 (표현이 풍부한 모델).
ELEVENLABS_MODEL=

# Anthropic API 키 (https://console.anthropic.com/settings/keys). 날마다 새 이야기를 쓰고, 레벨 테스트에서 Claude가 아이의 대답을 보고
# 다음 문제를 고르고 레벨을 정합니다. 비워 두면 기본 이야기와 앱에 든 기본 테스트(한 레벨에 두 문제씩)로 동작합니다.
ANTHROPIC_API_KEY=

# 쓰는 모델. 비워 두면 claude-haiku-5-5(싸고 빠름). 더 좋은 문장을 원하면 claude-sonnet-5-5.
ANTHROPIC_MODEL=
